{% extends 'base.html' %}

{% block title %}Server Error - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-5">
            <div class="mb-4">
                <i class="fa-solid fa-triangle-exclamation text-danger" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-dark mb-3">500</h1>
            <h2 class="h4 mb-3">Server Error</h2>
            <p class="text-muted mb-4">
                Something went wrong on our end. Our team has been notified. Please try again later.
            </p>
            <a href="{% url 'dashboard_home' %}" class="btn btn-primary btn-lg px-5">
                <i class="fa-solid fa-house me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
